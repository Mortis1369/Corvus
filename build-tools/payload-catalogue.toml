# Corvus payload catalogue — the single source of truth for what goes on the drive.
# Read by build-tools/stage-payload. Every url is the vendor's own site or GitHub releases;
# no mirrors, no repacks. Versions verified 2026-11-14.
#
# Fields: see build-tools/stage-payload/src/main.rs (Entry). kind defaults to "archive".

[settings]
downloads = "build-tools/downloads"
payload   = "payload"
# Bootstrap extractor (the old MediCat copy; only used at build time, never shipped).
sevenzip  = "../PortableApps/7-ZipPortable/App/7-Zip64/7z.exe"

